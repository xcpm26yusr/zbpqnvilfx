    try{ if(!quiet){ const k=document.getElementById('keep').checked; (k?localStorage:sessionStorage).setItem('pg_pw',pw); if(!k) localStorage.removeItem('pg_pw'); } }catch(e){}
    window.__PLAIN_HTML__=html;
    document.open(); document.write(html); document.close();
  }catch(e){ if(quiet){ try{localStorage.removeItem('pg_pw');sessionStorage.removeItem('pg_pw');}catch(_){} } else document.getElementById('err').textContent='비밀번호가 맞지 않습니다.'; }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();open_(document.getElementById('pw').value);});
try{const s=localStorage.getItem('pg_pw')||sessionStorage.getItem('pg_pw'); if(s) open_(s,true);}catch(e){}
