<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F4F5;color:#333;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.box{width:min(360px,calc(100% - 32px));background:#fff;border:1px solid #E9E3DC;border-radius:12px;box-shadow:0 4px 16px rgba(59,53,48,.06);padding:28px 26px;position:relative;overflow:hidden}

button{margin-top:10px;width:100%;border:0;border-radius:8px;padding:10px;background:#444;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.keep{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:#666;cursor:pointer}.keep input{width:auto;margin:0}
.err{min-height:18px;font-size:12px;color:#B8392F;margin-top:8px}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.data));
  return new TextDecoder().decode(pt);
}
async function open_(pw,quiet){
  try{
    const html=await unlock(pw);
    try{ if(!quiet){ const k=document.getElementById('keep').checked; (k?localStorage:sessionStorage).setItem('pg_pw',pw); if(!k) localStorage.removeItem('pg_pw'); } }catch(e){}
    window.__PLAIN_HTML__=html;
    document.open(); document.write(html); document.close();
  }catch(e){ if(quiet){ try{localStorage.removeItem('pg_pw');sessionStorage.removeItem('pg_pw');}catch(_){} } else document.getElementById('err').textContent='비밀번호가 맞지 않습니다.'; }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();open_(document.getElementById('pw').value);});
try{const s=localStorage.getItem('pg_pw')||sessionStorage.getItem('pg_pw'); if(s) open_(s,true);}catch(e){}
</script>
