const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.data));
  return new TextDecoder().decode(pt);
}
async function open_(pw,quiet){
  try{
    const html=await unlock(pw);
    try{ if(!quiet){ const k=document.getElementById('keep').checked; (k?localStorage:sessionStorage).setItem('pg_pw',pw); if(!k) localStorage.removeItem('pg_pw'); } }catch(e){}
    window.__PLAIN_HTML__=html;
    document.open(); document.write(html); document.close();
  }catch(e){ if(quiet){ try{localStorage.removeItem('pg_pw');sessionStorage.removeItem('pg_pw');}catch(_){} } else document.getElementById('err').textContent='비밀번호가 맞지 않습니다.'; }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();open_(document.getElementById('pw').value);});
try{const s=localStorage.getItem('pg_pw')||sessionStorage.getItem('pg_pw'); if(s) open_(s,true);}catch(e){}
</script>
